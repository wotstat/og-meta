services:
  og-meta:
    command: [ 'bun', '--watch', 'src/index.ts' ]
    restart: 'no'
    environment:
      PUBLIC_ORIGIN: http://localhost:9110
      IMAGE_ORIGIN: http://localhost:9110
    volumes:
      - type: bind
        source: ./src
        target: /app/src
        read_only: true
        bind:
          create_host_path: false
