worker_processes 2;
worker_shutdown_timeout 35s;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    # Keep all 4xx/5xx and requests taking at least one second.
    map "$status:$request_time" $meta_loggable {
        default 1;
        ~^[123][0-9][0-9]:0\. 0;
    }

    # Successful health checks are quiet even if they are slow.
    map "$uri:$status" $meta_access_log {
        default $meta_loggable;
        ~^/(health|ready):2[0-9][0-9]$ 0;
    }

    log_format meta escape=json
        '{"time":"$time_iso8601","host":"$host","request":"$request",'
        '"status":$status,"bytes_sent":$body_bytes_sent,"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr","upstream_status":"$upstream_status",'
        '"upstream_connect_time":"$upstream_connect_time",'
        '"upstream_header_time":"$upstream_header_time",'
        '"upstream_response_time":"$upstream_response_time",'
        '"forwarded_for":"$http_x_forwarded_for","user_agent":"$http_user_agent"}';

    access_log /dev/stdout meta if=$meta_access_log;
    keepalive_timeout 5s;
    send_timeout 30s;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;

    upstream meta {
        zone meta 64k;
        server __UPSTREAM__:3000 resolve;
    }

    server {
        listen 3000;

        location / {
            proxy_pass http://meta;
            proxy_http_version 1.1;

            proxy_set_header Connection '';
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

            proxy_connect_timeout 1s;
            proxy_read_timeout 25s;
            proxy_next_upstream off;
        }
    }
}
