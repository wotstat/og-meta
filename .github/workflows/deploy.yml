name: Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh/
          printf '%s\n' "$SSH_KEY" > ~/.ssh/production.key
          chmod 600 ~/.ssh/production.key
          cat >>~/.ssh/config <<END
          Host node
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/production.key
            StrictHostKeyChecking no
          END
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}

      - name: Copy to server
        env:
          APP_PATH: ${{ vars.APP_PATH }}
        run: |
          source_path="$APP_PATH/versions/$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          printf -v command '%q ' mkdir -p "$source_path"
          ssh node "$command"
          rsync -avz --protect-args --exclude=.git/ --exclude=node_modules/ --exclude='.env*' \
            --exclude=runtime/ --exclude=versions/ --exclude=current ./ "node:$source_path/"
          echo "DEPLOY_SOURCE=$source_path" >> "$GITHUB_ENV"

      - name: Run deploy script
        env:
          APP_PATH: ${{ vars.APP_PATH }}
        run: |
          printf -v command '%q ' sh "$DEPLOY_SOURCE/rerun.sh" meta --app-dir "$APP_PATH"
          ssh node "$command"
