services:
  og-meta:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - '127.0.0.1:9110:3000'
    environment:
      PUBLIC_ORIGIN: https://wotstat.info
      IMAGE_ORIGIN: https://og.wotstat.info
      RENDER_POOL_SIZE: '2'
      RENDER_QUEUE_LIMIT: '20'
      RENDER_TIMEOUT_MS: '15000'
      CHROME_NO_SANDBOX: 'true'
      CLICKHOUSE_PROXY_URL: http://host.docker.internal:8124/
      CLICKHOUSE_USER: internal-public
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    networks:
      - og-meta
    volumes:
      - type: bind
        source: ../analytics-frontend/dist-meta
        target: /meta
        read_only: true
        bind:
          create_host_path: false
    shm_size: 256mb

    healthcheck:
      test: [ 'CMD', 'bun', '-e', 'const r = await fetch("http://127.0.0.1:3000/ready"); process.exit(r.ok ? 0 : 1)' ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    stop_grace_period: 20s

networks:
  og-meta:
    ipam:
      config:
        - subnet: 172.31.0.0/16
